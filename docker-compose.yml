name: blog-igaming

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: payload_db
    ports:
      # 5433 en el host a proposito: el 5432 lo suele ocupar un PostgreSQL
      # instalado nativamente. Dentro de la red de Docker sigue siendo 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d payload_db"]
      interval: 5s
      timeout: 5s
      retries: 12

# Los archivos que se suben desde el panel no necesitan servicio: Payload los
# escribe en `apps/web/media/` (ver `staticDir` en la coleccion Media) y los
# sirve el mismo Next por /api/media/file/. En produccion es lo mismo, con esa
# carpeta en un volumen de Docker. Esa carpeta esta en el .gitignore.

volumes:
  postgres-data:
