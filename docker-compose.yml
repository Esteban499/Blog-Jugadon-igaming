name: blog-igaming

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: payload_db
    ports:
      # 5433 en el host a proposito: el 5432 lo suele ocupar un PostgreSQL
      # instalado nativamente. Dentro de la red de Docker sigue siendo 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d payload_db"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Equivalente local de Cloudflare R2: misma API S3, mismo SDK.
  # Pasar a produccion es cambiar variables de entorno, no codigo.
  minio:
    image: minio/minio:latest
    container_name: blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # consola web
    volumes:
      - minio-data:/data

  # Crea el bucket de media una vez que MinIO responde, y sale.
  minio-init:
    image: minio/mc:latest
    container_name: blog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'esperando a MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/blog-media;
      mc anonymous set download local/blog-media;
      echo 'bucket blog-media listo';
      "

volumes:
  postgres-data:
  minio-data:
