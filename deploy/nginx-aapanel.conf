# Nginx del sitio en aaPanel: le pasa todo a la app, que escucha en el
# loopback (ver docker-compose.prod.yml).
#
# DONDE VA: adentro del bloque `server { ... }` del sitio, en
# Website > (el sitio) > Config. Paso a paso en el README, "El sitio en aaPanel".
#
# NO usar la pestania "Reverse proxy" de aaPanel: arma un `location ^~ /` que
# le gana a los bloques de aca abajo y deja /admin abierto a cualquiera.
#
# ANTES DE PEGAR, borrar de la configuracion que genera aaPanel los dos bloques
# de archivos estaticos:
#
#   location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$ { ... }
#   location ~ .*\.(js|css)?$ { ... }
#
# Buscan los archivos en la carpeta del sitio (/www/wwwroot/...), que esta
# vacia: los JS de Next, los logos y las imagenes darian 404. Todo eso lo sirve
# la app, con sus propias cabeceras de cache.
#
# El certificado se saca desde la pestania SSL de aaPanel (Let's Encrypt), con
# "Force HTTPS" prendido. aaPanel escribe sus propias lineas de SSL en este
# mismo `server`; esto no las toca.

# No anunciar la version de Nginx.
server_tokens off;

# Las imagenes que se suben desde el panel. El default de Nginx es 1 MB.
client_max_body_size 50m;

# Solo HTTPS por un anio. Va aca y no en la app porque Nginx es el que termina
# TLS. Si se activa HSTS tambien desde la pestania SSL de aaPanel, borrar esta
# linea para no mandar la cabecera dos veces.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Lo que la app necesita saber del pedido original: el host, la IP real y que
# llego por HTTPS. Se declara una vez aca y lo heredan los `location` que hacen
# proxy al 3000.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Las imagenes de Payload: publicas. `^~` corta la busqueda de expresiones
# regulares, asi que la restriccion del bloque siguiente no las alcanza.
location ^~ /api/media/file/ {
    proxy_pass http://127.0.0.1:3000;
}

# El basemap del mapa de puntos de venta: UN archivo .pmtiles de unos 100 MB
# que MapLibre lee por rangos HTTP, bajando solo los pedazos que estan en
# pantalla. Lo sirve Nginx directo desde el disco, no la app: son cientos de
# pedidos con `Range` que no tienen por que pasar por el proceso de Node, y
# Nginx responde 206 de fabrica.
#
# El archivo se copia a mano a esa carpeta, una vez (ver README, "El mapa").
# Al salir por el mismo dominio que el sitio no hace falta CORS.
location ^~ /mapa/ {
    alias /www/wwwroot/CAMBIAR.com.ar/mapa/;   # CAMBIAR por la carpeta del sitio
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# El panel y la API de Payload, solo desde la oficina o la VPN. El publico no
# los usa: el sitio lee la base del lado del servidor, por la Local API.
#
# Viene CERRADO a proposito, con una IP de ejemplo que no es de nadie: con la
# base vacia, Payload muestra en /admin la pantalla para crear el primer
# usuario, y el primero que llega queda de admin. Reemplazarla por las reales,
# una linea `allow` por IP o rango (`allow 198.51.100.0/24;`).
#
# Si delante de aaPanel hay otro proxy (Cloudflare, un balanceador), Nginx ve
# la IP del proxy y no la de quien entra: antes hay que configurar
# `set_real_ip_from` y `real_ip_header`, o esto habilita a todo el que pase por
# ese proxy.
location ~ ^/(admin|api)(/|$) {
    allow 203.0.113.10;   # CAMBIAR
    deny all;

    proxy_pass http://127.0.0.1:3000;
    # "Leer promociones ahora" corre el bot entero antes de contestar, y el
    # default de 60 segundos lo cortaria a la mitad.
    proxy_read_timeout 300s;
}

# Todo lo demas: el sitio publico.
location / {
    proxy_pass http://127.0.0.1:3000;
}
