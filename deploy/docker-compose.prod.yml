# Produccion en una VM con aaPanel: Postgres y la app.
#
# Adelante va el Nginx de aaPanel, configurado con `nginx-aapanel.conf`: termina
# TLS y le pasa los pedidos a la app por el loopback. Aca no hay proxy propio.
#
# No se levanta a mano: lo corre `desplegar.sh` a traves del gestor de
# secretos. Ver "Produccion en una VM" en el README.
#
# Ningun secreto esta escrito en este archivo ni en ningun otro de la VM. Los
# pone el gestor en el entorno del proceso que corre `docker compose`, y cada
# `${VAR:?}` hace que compose se niegue a arrancar si alguno no llego, en vez
# de levantar un servicio con la variable vacia.
#
# La configuracion que NO es secreta (URLs publicas, puertos) vive en
# `produccion.env`, versionada, para que se revise como el resto del codigo.

name: jugadon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jugadon
      POSTGRES_DB: jugadon
      # Solo se lee la primera vez, al crear el volumen. Rotarla despues es un
      # `ALTER USER jugadon PASSWORD '...'` y recien ahi cambiarla en el gestor.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}
    ports:
      # Solo en el loopback de la VM. Lo usan el build de la imagen, que corre
      # fuera de la red de compose, y los respaldos. Nunca expuesto afuera. Si
      # aaPanel ya tiene un PostgreSQL propio en el 5432, se cambia
      # PUERTO_POSTGRES en produccion.env.
      - "127.0.0.1:${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jugadon -d jugadon"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    image: jugadon-web:latest
    build:
      context: ../apps/web
      # El build prerenderiza contra la base, que para el build es el puerto
      # que postgres publica en el loopback.
      network: host
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?falta NEXT_PUBLIC_SERVER_URL}
        NEXT_PUBLIC_MAPA_TILES_URL: ${NEXT_PUBLIC_MAPA_TILES_URL:-}
        NEXT_PUBLIC_MAPA_GLIFOS_URL: ${NEXT_PUBLIC_MAPA_GLIFOS_URL:-}
        YOUTUBE_CANAL_ID: ${YOUTUBE_CANAL_ID:-}
      secrets:
        - database_uri
        - payload_secret
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Solo en el loopback: la unica puerta desde afuera es el Nginx de
      # aaPanel. Al estar atado a 127.0.0.1, tampoco lo abre el atajo con el
      # que Docker se saltea el firewall del sistema. Si se cambia
      # PUERTO_WEB, cambiar tambien `proxy_pass` en nginx-aapanel.conf.
      - "127.0.0.1:${PUERTO_WEB:-3000}:3000"
    env_file: produccion.env
    volumes:
      # Los archivos que se suben desde el panel. En un volumen y no en la
      # imagen: `desplegar.sh` reconstruye la imagen en cada despliegue.
      #
      # Es el unico lugar donde viven. Perder este volumen es perder todas las
      # imagenes del sitio, y la base queda con filas de `media` apuntando a
      # archivos que ya no existen: entra al respaldo junto con el pg_dump.
      - media-data:/app/media
    environment:
      DATABASE_URI: postgres://jugadon:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/jugadon
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?falta PAYLOAD_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# Secretos del BUILD. Salen del entorno de `docker compose` y entran al RUN del
# Dockerfile como montajes de BuildKit, sin quedar en la imagen.
secrets:
  database_uri:
    environment: DATABASE_URI_BUILD
  payload_secret:
    environment: PAYLOAD_SECRET

volumes:
  postgres-data:
  media-data:
